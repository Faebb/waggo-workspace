<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 390 844" width="390" height="844" role="img" data-marco="comun-onboarding-bienvenida--claro"><defs><filter id="comun-onboarding-bienvenida--claro__shCard" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#16212E" flood-opacity="0.10"/></filter><filter id="comun-onboarding-bienvenida--claro__shSheet" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="-4" stdDeviation="12" flood-color="#16212E" flood-opacity="0.16"/></filter><filter id="comun-onboarding-bienvenida--claro__shFab" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16212E" flood-opacity="0.22"/></filter></defs><rect id="comun-onboarding-bienvenida--claro__Background" x="0" y="0" width="390" height="844" fill="#FFF0E9"/><g id="comun-onboarding-bienvenida--claro__Logo/hero"><use href="#brand-hero" x="120" y="30" width="150" height="150"/></g><text x="24" y="200" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#3A4A5C" letter-spacing="0.8">PASEADORES VERIFICADOS, EN VIVO</text><text x="24" y="244" font-family="'Baloo 2', 'Baloo2', sans-serif" font-size="34" font-weight="700" fill="#16212E" letter-spacing="-0.5">Paseos</text><text x="140" y="244" font-family="'Baloo 2', 'Baloo2', sans-serif" font-size="34" font-weight="700" fill="#3059A4" letter-spacing="-0.5">seguros</text><text x="24" y="282" font-family="'Baloo 2', 'Baloo2', sans-serif" font-size="34" font-weight="700" fill="#16212E" letter-spacing="-0.5">para tu perro</text><text x="24" y="320" font-family="'Inter', sans-serif" font-size="16" font-weight="400" fill="#3A4A5C">Pide un paseo como pides un viaje: ves</text><text x="24" y="344" font-family="'Inter', sans-serif" font-size="16" font-weight="400" fill="#3A4A5C">al paseador en el mapa y pagas al</text><text x="24" y="368" font-family="'Inter', sans-serif" font-size="16" font-weight="400" fill="#3A4A5C">final.</text><g id="comun-onboarding-bienvenida--claro__ValueCard/Paseadores verificados"><rect x="24" y="390" width="44" height="44" rx="22" fill="#FBE2D3"/><g transform="translate(35 401) scale(0.9167000000000001)" fill="none" stroke="#3059A4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6z"/><path d="m9 12 2 2 4-4"/></g><text x="84" y="408" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#16212E">Paseadores verificados</text><text x="84" y="430" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#3A4A5C">Revisamos su identidad antes de su</text><text x="84" y="450" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#3A4A5C">primer paseo.</text></g><g id="comun-onboarding-bienvenida--claro__ValueCard/Paseo en vivo"><rect x="24" y="470" width="44" height="44" rx="22" fill="#FBE2D3"/><g transform="translate(35 481) scale(0.9167000000000001)" fill="none" stroke="#3059A4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c3 0 3-4 6-4s3 4 6 4"/><path d="M18 4a3 3 0 0 1 3 3c0 2.2-3 5-3 5s-3-2.8-3-5a3 3 0 0 1 3-3z"/></g><text x="84" y="488" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#16212E">Paseo en vivo</text><text x="84" y="510" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#3A4A5C">Sigue la ruta en el mapa, minuto a</text><text x="84" y="530" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#3A4A5C">minuto.</text></g><g id="comun-onboarding-bienvenida--claro__ValueCard/Pagas al final"><rect x="24" y="550" width="44" height="44" rx="22" fill="#FBE2D3"/><g transform="translate(35 561) scale(0.9167000000000001)" fill="none" stroke="#3059A4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="m9 15 2 2 4-4"/></g><text x="84" y="568" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#16212E">Pagas al final</text><text x="84" y="590" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#3A4A5C">Retenemos el pago y solo se cobra si</text><text x="84" y="610" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#3A4A5C">el paseo ocurre.</text></g><g id="comun-onboarding-bienvenida--claro__Button/primary/default"><rect x="24" y="640" width="342" height="52" rx="26" fill="#3059A4"/><text x="195" y="672.5" font-family="'Baloo 2', 'Baloo2', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Pedir un paseo</text></g><g id="comun-onboarding-bienvenida--claro__Button/secondary/default"><rect x="24" y="704" width="342" height="52" rx="26" fill="transparent" stroke="#16212E" stroke-width="1.5"/><text x="195" y="736.5" font-family="'Baloo 2', 'Baloo2', sans-serif" font-size="18" font-weight="700" fill="#16212E" text-anchor="middle">Quiero ser paseador</text></g><text x="195" y="792" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#3059A4" text-anchor="middle">Ya tengo cuenta · Iniciar sesión</text><g id="comun-onboarding-bienvenida--claro__StatusBar"><text x="34" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#16212E">9:41</text><g fill="#16212E"><rect x="292" y="24" width="3" height="5" rx="1"/><rect x="297" y="22" width="3" height="7" rx="1"/><rect x="302" y="20" width="3" height="9" rx="1"/><rect x="307" y="18" width="3" height="11" rx="1"/></g><path d="M318 23a9 9 0 0 1 13 0M321 26a5 5 0 0 1 7 0" fill="none" stroke="#16212E" stroke-width="2" stroke-linecap="round"/><rect x="338" y="18" width="24" height="12" rx="3.5" fill="none" stroke="#16212E" stroke-width="1.2" opacity="0.6"/><rect x="340" y="20" width="18" height="8" rx="2" fill="#16212E"/></g><rect id="comun-onboarding-bienvenida--claro__HomeIndicator" x="128" y
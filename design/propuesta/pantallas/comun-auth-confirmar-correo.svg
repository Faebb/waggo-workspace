" font-weight="400" fill="#3A4A5C" text-anchor="middle">El enlace vence en 24 horas.</text><g id="Button/primary/default"><rect x="24" y="656" width="342" height="52" rx="26" fill="#3059A4"/><text x="195" y="688.5" font-family="'Baloo 2', 'Baloo2', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Abrir mi correo</text></g><g id="Button/secondary/default"><rect x="24" y="720" width="342" height="52" rx="26" fill="transparent" stroke="#16212E" stroke-width="1.5"/><text x="195" y="752.5" font-family="'Baloo 2', 'Baloo2', sans-serif" font-size="18" font-weight="700" fill="#16212E" text-anchor="middle">Ya lo confirmé, iniciar sesión</text></g><text x="195" y="560" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#3A4A5C" text-anchor="middle">¿No llegó? Revisa la carpeta de spam o reenvíalo.</text><g id="StatusBar"><text x="34" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#16212E">9:41</text><g fill="#16212E"><rect x="292" y="24" width="3" height="5" rx="1"/><rect x="297" y="22" width="3" height="7" rx="1"/><rect x="302" y="20" width="3" height="9" rx="1"/><rect x="307" y="18" width="3" height="11" rx="1"/></g><path d="M318 23a9 9 0 0 1 13 0M321 26a5 5 0 0 1 7 0" fill="none" stroke="#16212E" stroke-width="2" stroke-linecap="round"/><rect x="338" y="18" width="24" height="12" rx="3.5" fill="none" stroke="#16212E" stroke-width="1.2" opacity="0.6"/><rect x="340" y="20" width="18" height="8" rx="2" fill="#16212E"/></g><rect id="HomeIndicator" x="128" y="830" width="134" height="5" rx="2.5" fill="#16212E"/></svg><rect x="39.5" y="95.5" width="391" height="845" fill="none" stroke="#16212E" stroke-opacity="0.12"/><text x="478" y="84" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#16212E">Confirmada</text><svg id="comun-auth-confirmar-correo--confirmada" x="478" y="96" width="390" height="844" viewBox="0 0 390 844" overflow="hidden"><rect id="Background" x="0" y="